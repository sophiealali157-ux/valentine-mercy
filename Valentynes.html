<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>💖 Valentine Question 💖</title>
  <style>
    body {
      background: linear-gradient(to right, #ff9a9e, #fad0c4);
      font-family: Arial, sans-serif;
      text-align: center;
      padding-top: 60px;
      overflow: hidden;
    }
    .card {
      background: white;
      width: 90%;
      max-width: 400px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      position: relative;
      z-index: 2;
    }
    h1 {
      color: #e91e63;
    }
    button {
      background: #e91e63;
      color: white;
      border: none;
      padding: 12px 25px;
      margin: 10px;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #c2185b;
    }
    #noBtn {
      position: absolute;
    }
    #result {
      margin-top: 20px;
      font-size: 18px;
      color: #e91e63;
    }
    .signature {
      margin-top: 25px;
      font-size: 14px;
      color: #777;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      bottom: -20px;
      color: #e91e63;
      font-size: 20px;
      animation: floatUp 6s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% { transform: translateY(0); opacity: 0.7; }
      100% { transform: translateY(-100vh); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- Background music -->
  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
  </audio>

  <div class="card">
    <h1>💘 Hey Mercy 💘</h1>
    <p>My heart ran a program and got this result:</p>
    <p><strong>Compatibility: 100% ❤️</strong></p>

    <h2>Mercy, will you be my Valentine? 🌹</h2>

    <button onclick="yesAnswer()">YES 💖</button>
    <button id="noBtn" onmouseover="moveNo()">NO 😅</button>

    <p id="result"></p>

    <div class="signature">
      — From Sophie 💘
    </div>
  </div>

  <script>
    function yesAnswer() {
      document.getElementById("result").innerHTML =
        "😍 Yay Mercy! You just made my heart the happiest 💕<br>" +
        "🎉 I can’t stop smiling! You officially have the title of my forever Valentine 🌹<br>" +
        "💌 Prepare for endless hugs, cheesy love messages, and maybe a surprise or two 😏💖<br>" +
        "💃💖 Let’s celebrate this perfect 100% match — starting now! 🌟💞<br>" +
        "🥰 Every beat of my heart says your name, and today is all about us! 💝";
    }

    function moveNo() {
      const btn = document.getElementById("noBtn");
      const x = Math.random() * 200;
      const y = Math.random() * 200;
      btn.style.left = x + "px";
      btn.style.top = y + "px";
    }

    // Floating hearts
    setInterval(() => {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.innerHTML = "❤️";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = Math.random() * 20 + 15 + "px";
      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 6000);
    }, 500);
  </script>

</body>
</html>
